# Selfhost Kit: synced from tyler-class/selfhost-kit (kit/workflows/update.yml).
# Keeps a copy made with the Deploy to Cloudflare button up to date with tyler-class/ratio.
# The button makes a plain copy (not a fork) and leaves this file out, so Ratio's Settings →
# Updates offers to add it. Each run brings the latest Ratio into this repo and pushes; that
# push is what Cloudflare deploys from. Ratio never deploys to your Cloudflare directly.
# Your data lives in the database and file storage, not here, so it isn't touched.
name: Update Ratio

on:
  schedule:
    - cron: '23 9 * * 1' # Mondays
  # "Update now" in Ratio's Settings opens this workflow's Run button.
  workflow_dispatch:
  # Adding (or changing) this file runs it once straight away.
  push:
    paths: ['.github/workflows/update.yml']

permissions:
  contents: write
  # For the keep-alive step below.
  actions: write

jobs:
  update:
    # Only in copies, never in Ratio itself.
    if: github.repository != 'tyler-class/ratio'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Take the latest Ratio
        run: |
          git fetch --depth=1 https://github.com/tyler-class/ratio.git main
          upstream=$(git rev-parse FETCH_HEAD)

          # Kept from this copy: its workflows (GitHub doesn't let this job change them) and a
          # wrangler.jsonc that has its own database id written in.
          keep=$(mktemp -d)
          cp -r .github/workflows "$keep/workflows"
          if grep -q '"database_id"' wrangler.jsonc; then cp wrangler.jsonc "$keep/"; fi

          git rm -rq .
          git checkout "$upstream" -- .
          rm -rf .github/workflows && cp -r "$keep/workflows" .github/workflows
          if [ -f "$keep/wrangler.jsonc" ]; then cp "$keep/wrangler.jsonc" .; fi
          git add -A

          if git diff --cached --quiet; then
            echo "Already up to date."
            exit 0
          fi
          if ! git diff --quiet "$upstream" HEAD -- .github/workflows 2>/dev/null; then
            echo "::notice::Your .github/workflows differ from Ratio's and were left as they are. Copy any you want from tyler-class/ratio by hand."
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -qm "Update Ratio to ${upstream:0:7}"
          git push

      # GitHub turns off scheduled workflows in a repo with no activity for 60 days, and this one
      # only commits when there's a new version. Re-enabling it on every run resets that timer,
      # so the weekly check never switches itself off.
      - name: Keep this workflow enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"
